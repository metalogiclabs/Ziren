name: MathGraph FV format-2 source-binding bridge

on:
  push:
    branches:
      - mathgraph/ziren-format2-regeneration-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-09-17 --profile minimal
          rustup override set nightly-2026-09-17
          cargo --version
          rustc --version

      - name: Build the unchanged source extractor
        run: cargo build --locked --release -p zkm-picus

      - name: Generate fresh base chip constraints without external snippets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/empty"
          PICUS_SNIPPET_DIR="$RUNNER_TEMP/empty" timeout 600s \
            target/release/zkm-picus --all --format lean \
            --lean-out-dir "$RUNNER_TEMP/base" > "$RUNNER_TEMP/base.log" 2>&1
          PICUS_SNIPPET_DIR="$RUNNER_TEMP/empty" timeout 300s \
            target/release/zkm-picus --chip CloClz --shrcarry-summary precise --format lean \
            --lean-out-dir "$RUNNER_TEMP/base" >> "$RUNNER_TEMP/base.log" 2>&1
          find "$RUNNER_TEMP/base/ZirenDet/Chips" -maxdepth 1 -type f -name '*.lean' -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/base-source.sha256"

      - name: Run the pinned checker regression tests
        run: python3 crates/fv/lean4/check/test_pin_statements.py

      - name: Audit base-source binding receipts against pinned legacy records
        shell: bash
        run: |
          set -euo pipefail
          python3 crates/fv/lean4/check/pin_statements.py snapshot \
            "$RUNNER_TEMP/base/ZirenDet" > "$RUNNER_TEMP/base-format2.json"
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP'])
          old = json.loads(pathlib.Path('crates/fv/lean4/statements.json').read_text())
          new = json.loads((out / 'base-format2.json').read_text())
          assert old['format'] == 'ziren-fv-statements/1'
          assert new['format'] == 'ziren-fv-statements/2'
          guarded_fields = ['inputs', 'outputs', 'assumed', 'aliases', 'witness', 'constraints']
          guarded_hashes = ['inputs', 'outputs', 'assumed', 'aliases', 'witness', 'constraints']
          matched, reasons = [], {}
          for key, record in old['modules'].items():
              candidate = new['modules'].get(key)
              if candidate is None:
                  reasons[key] = ['module missing from base output']
                  continue
              if record.get('kind') != 'module' or candidate.get('kind') != 'module':
                  continue  # Helpers carry no source-port receipts.
              diffs = [f for f in guarded_fields if record.get(f) != candidate.get(f)]
              diffs += ['hashes.' + f for f in guarded_hashes
                        if record.get('hashes', {}).get(f) != candidate.get('hashes', {}).get(f)]
              if 'port_sources' not in candidate:
                  diffs.append('missing source port receipt')
              if diffs:
                  reasons[key] = diffs
              else:
                  matched.append(key)
          missing_keys = sorted(set(old['modules']) - set(new['modules']))
          unexpected_keys = sorted(set(new['modules']) - set(old['modules']))
          report = {'legacy_file_count': len(old['files']),
                    'base_file_count': len(new['files']),
                    'legacy_module_count': len(old['modules']),
                    'base_module_count': len(new['modules']),
                    'guarded_field_matches': len(matched),
                    'guarded_field_mismatches': reasons,
                    'missing_module_keys': missing_keys,
                    'unexpected_module_keys': unexpected_keys,
                    'full_legacy_equivalence_not_claimed': True}
          (out / 'base-source-bridge.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Preserve receipts even on an incomplete or failed gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziren-format2-base-source-bridge-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/base-format2.json
            ${{ runner.temp }}/base-source-bridge.json
            ${{ runner.temp }}/base-source.sha256
            ${{ runner.temp }}/base.log
