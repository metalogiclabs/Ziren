name: MathGraph FV format-2 source-binding bridge

on:
  push:
    branches:
      - mathgraph/ziren-format2-regeneration-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/addsub-port-provenance-regression
          fetch-depth: 3
          persist-credentials: false

      - name: Identify exact candidate and legacy ancestor
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git rev-parse HEAD~2)" = fcd3bbced39f2c26288bb505b9e89a828d8c3538
          git rev-parse 'HEAD:crates/fv/lean4/statements.json'

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-09-17 --profile minimal
          rustup override set nightly-2026-09-17
          cargo --version
          rustc --version

      - name: Build the unchanged source extractor
        run: cargo build --locked --release -p zkm-picus

      - name: Generate fresh base chip constraints without external snippets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/empty"
          PICUS_SNIPPET_DIR="$RUNNER_TEMP/empty" timeout 600s \
            target/release/zkm-picus --all --format lean \
            --lean-out-dir "$RUNNER_TEMP/base" > "$RUNNER_TEMP/base.log" 2>&1
          PICUS_SNIPPET_DIR="$RUNNER_TEMP/empty" timeout 300s \
            target/release/zkm-picus --chip CloClz --shrcarry-summary precise --format lean \
            --lean-out-dir "$RUNNER_TEMP/base" >> "$RUNNER_TEMP/base.log" 2>&1
          find "$RUNNER_TEMP/base/ZirenDet/Chips" -maxdepth 1 -type f -name '*.lean' -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/base-source.sha256"

      - name: Run the pinned checker regression tests
        run: python3 crates/fv/lean4/check/test_pin_statements.py

      - name: Qualify committed format-2 baseline against unchanged base source and format-1 ancestor
        shell: bash
        run: |
          set -euo pipefail
          python3 crates/fv/lean4/check/pin_statements.py snapshot \
            "$RUNNER_TEMP/base/ZirenDet" > "$RUNNER_TEMP/base-format2.json"
          python3 - <<'PY'
          import io, json, os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP'])
          manifest = 'crates/fv/lean4/statements.json'
          legacy = json.loads(subprocess.check_output(
              ['git', 'show', f'HEAD~2:{manifest}'], text=True))
          candidate = json.loads(pathlib.Path(manifest).read_text())
          base = json.loads((out / 'base-format2.json').read_text())
          assert legacy['format'] == 'ziren-fv-statements/1'
          assert candidate['format'] == base['format'] == 'ziren-fv-statements/2'
          assert legacy['files'] == candidate['files'] == base['files']
          assert legacy['modules'].keys() == candidate['modules'].keys() == base['modules'].keys()
          assert len(candidate['files']) == 62 and len(candidate['modules']) == 155

          def without(obj, keys):
              return {k: v for k, v in obj.items() if k not in keys}

          source_matches = 0
          inventory_deltas = {'other_theorems': [], 'sections': []}
          for key, previous in legacy['modules'].items():
              current = candidate['modules'][key]
              native = base['modules'][key]
              # Every format-1 claim and its metadata must survive unchanged.
              assert without(current, {'port_sources'}) == previous, key
              if current['kind'] == 'module':
                  source_matches += 1
                  assert current['port_sources'] == native['port_sources'], key
              else:
                  assert 'port_sources' not in current, key
              # The source-only extractor cannot regenerate historical proof inventory.
              for field in ('other_theorems', 'sections'):
                  if current.get(field) != native.get(field):
                      inventory_deltas[field].append(key)
              assert without(current, {'other_theorems', 'sections'}) == without(
                  native, {'other_theorems', 'sections'}), key
          assert source_matches == 129

          sys.path.insert(0, 'crates/fv/lean4/check')
          import pin_statements as checker
          diagnostic = io.StringIO()
          weakening_count = checker.compare(candidate, base, out=diagnostic)
          assert weakening_count == 0, diagnostic.getvalue()
          report = {
              'candidate_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'candidate_blob_sha': subprocess.check_output(['git', 'rev-parse', f'HEAD:{manifest}'], text=True).strip(),
              'legacy_ancestor': subprocess.check_output(['git', 'rev-parse', 'HEAD~2'], text=True).strip(),
              'files_verified': len(candidate['files']),
              'modules_verified': len(candidate['modules']),
              'native_source_receipts_verified': source_matches,
              'non_inventory_fields_identical': True,
              'format1_fields_conserved': True,
              'source_only_inventory_deltas': {k: len(v) for k, v in inventory_deltas.items()},
              'compare_weakenings': weakening_count,
              'proofs_not_regenerated_or_rechecked': True,
          }
          (out / 'base-source-bridge.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Preserve receipts even on an incomplete or failed gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziren-format2-base-source-bridge-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/base-format2.json
            ${{ runner.temp }}/base-source-bridge.json
            ${{ runner.temp }}/base-source.sha256
            ${{ runner.temp }}/base.log
