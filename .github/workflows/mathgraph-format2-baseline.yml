name: MathGraph FV format-2 source-binding bridge

on:
  push:
    branches:
      - mathgraph/ziren-format2-regeneration-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mathgraph/addsub-port-provenance-regression
          fetch-depth: 4
          persist-credentials: false

      - name: Identify exact candidate and legacy ancestor
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git rev-parse HEAD~3)" = fcd3bbced39f2c26288bb505b9e89a828d8c3538
          git rev-parse 'HEAD:crates/fv/lean4/statements.json'

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-09-17 --profile minimal
          rustup override set nightly-2026-09-17
          cargo --version
          rustc --version

      - name: Build the unchanged source extractor
        run: cargo build --locked --release -p zkm-picus

      - name: Generate fresh base chip constraints without external snippets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/empty"
          PICUS_SNIPPET_DIR="$RUNNER_TEMP/empty" timeout 600s \
            target/release/zkm-picus --all --format lean \
            --lean-out-dir "$RUNNER_TEMP/base" > "$RUNNER_TEMP/base.log" 2>&1
          PICUS_SNIPPET_DIR="$RUNNER_TEMP/empty" timeout 300s \
            target/release/zkm-picus --chip CloClz --shrcarry-summary precise --format lean \
            --lean-out-dir "$RUNNER_TEMP/base" >> "$RUNNER_TEMP/base.log" 2>&1
          find "$RUNNER_TEMP/base/ZirenDet/Chips" -maxdepth 1 -type f -name '*.lean' -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/base-source.sha256"

      - name: Diagnose Keccak archived-recipe input assumptions against native source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          path = root / 'base/ZirenDet/Chips/KeccakSponge.lean'
          source = path.read_text()
          def extract(name):
              match = re.search(r'^def ' + name + r' \(w : W\) : List F :=\s*\n\s*\[([^\n]+)\]',
                                source, re.M)
              assert match, 'Cannot locate native port list: ' + name
              return [int(n) for n in re.findall(r'w\.v(\d+)', match.group(1))]
          inputs, outputs = extract('inputs'), extract('outputs')
          expected_limb_cols = list(range(125, 225))
          missing = [c for c in expected_limb_cols if c not in inputs]
          origins_match = re.search(r'^def input_origins : List String := (\[[^\n]+\])',
                                    source, re.M)
          assert origins_match, 'Missing input origins on current source'
          origins = json.loads(origins_match.group(1))
          assert len(origins) == len(inputs)
          report = {
              'source_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'native_input_count': len(inputs), 'native_output_count': len(outputs),
              'native_inputs_first_12': inputs[:12],
              'native_outputs_first_12': outputs[:12],
              'expected_archived_keccak_limb_count': len(expected_limb_cols),
              'missing_archived_keccak_limb_columns': missing,
              'first_port_mappings': list(zip(origins, inputs))[:12],
              'source_has_archived_limb_columns': not missing,
              'interpretation': 'Diagnostic only; generator and proof are unchanged.',
          }
          (root / 'keccak-archive-compatibility.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Run the pinned checker regression tests
        run: python3 crates/fv/lean4/check/test_pin_statements.py

      - name: Qualify committed format-2 baseline against unchanged base source and format-1 ancestor
        shell: bash
        run: |
          set -euo pipefail
          python3 crates/fv/lean4/check/pin_statements.py snapshot \
            "$RUNNER_TEMP/base/ZirenDet" > "$RUNNER_TEMP/base-format2.json"
          python3 - <<'PY'
          import io, json, os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP'])
          manifest = 'crates/fv/lean4/statements.json'
          legacy = json.loads(subprocess.check_output(
              ['git', 'show', f'HEAD~3:{manifest}'], text=True))
          candidate = json.loads(pathlib.Path(manifest).read_text())
          base = json.loads((out / 'base-format2.json').read_text())
          assert legacy['format'] == 'ziren-fv-statements/1'
          assert candidate['format'] == base['format'] == 'ziren-fv-statements/2'
          assert legacy['files'] == candidate['files'] == base['files']
          assert legacy['modules'].keys() == candidate['modules'].keys() == base['modules'].keys()
          assert len(candidate['files']) == 62 and len(candidate['modules']) == 155

          def without(obj, keys):
              return {k: v for k, v in obj.items() if k not in keys}

          source_matches = 0
          inventory_deltas = {'other_theorems': [], 'sections': []}
          for key, previous in legacy['modules'].items():
              current = candidate['modules'][key]
              native = base['modules'][key]
              # Every format-1 claim and its metadata must survive unchanged.
              assert without(current, {'port_sources'}) == previous, key
              if current['kind'] == 'module':
                  source_matches += 1
                  assert current['port_sources'] == native['port_sources'], key
              else:
                  assert 'port_sources' not in current, key
              # The source-only extractor cannot regenerate historical proof inventory.
              for field in ('other_theorems', 'sections'):
                  if current.get(field) != native.get(field):
                      inventory_deltas[field].append(key)
              assert without(current, {'other_theorems', 'sections'}) == without(
                  native, {'other_theorems', 'sections'}), key
          assert source_matches == 129

          sys.path.insert(0, 'crates/fv/lean4/check')
          import pin_statements as checker
          diagnostic = io.StringIO()
          weakening_count = checker.compare(candidate, base, out=diagnostic)
          assert weakening_count == 0, diagnostic.getvalue()
          report = {
              'candidate_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'candidate_blob_sha': subprocess.check_output(['git', 'rev-parse', f'HEAD:{manifest}'], text=True).strip(),
              'legacy_ancestor': subprocess.check_output(['git', 'rev-parse', 'HEAD~3'], text=True).strip(),
              'files_verified': len(candidate['files']),
              'modules_verified': len(candidate['modules']),
              'native_source_receipts_verified': source_matches,
              'non_inventory_fields_identical': True,
              'format1_fields_conserved': True,
              'source_only_inventory_deltas': {k: len(v) for k, v in inventory_deltas.items()},
              'compare_weakenings': weakening_count,
              'proofs_not_regenerated_or_rechecked': True,
          }
          (out / 'base-source-bridge.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Replay meaning-bearing AddSub output mutations in freshly generated source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, json, os, pathlib, re, shutil, sys
          sys.path.insert(0, 'crates/fv/lean4/check')
          import pin_statements as checker
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          original_dir = temp / 'base' / 'ZirenDet'
          chip = original_dir / 'Chips' / 'AddSub.lean'
          full = chip.read_text()
          lead, sep, rest = full.partition('namespace AddSub_is_add\n')
          assert sep, 'unchanged AddSub module not found'
          module, end, tail = rest.partition('\nend AddSub_is_add')
          assert end, 'AddSub module end not found'

          output_pattern = re.compile(r'(def outputs \(w : W\) : List F :=\s*\n\s*)\[([^\]\n]+)\]')
          origins_pattern = re.compile(r'def output_origins : List String := (\[[^\n]+\])')
          output_match = output_pattern.search(module)
          origins_match = origins_pattern.search(module)
          assert output_match and origins_match
          original_values = [part.strip() for part in output_match.group(2).split(',')]
          original_labels = json.loads(origins_match.group(1))
          assert len(original_values) == len(original_labels) >= 4
          assert [original_labels[i] for i in (1, 3)] == ['state_send[1]', 'state_send[3]']

          pinned = json.loads(pathlib.Path('crates/fv/lean4/statements.json').read_text())
          native = checker.snapshot(original_dir)
          assert checker.compare(pinned, native, out=io.StringIO()) == 0
          record = pinned['modules']['AddSub/AddSub_is_add']
          source_map = dict(record['port_sources']['bindings']['outputs'])
          assert source_map['state_send[1]'] != source_map['state_send[3]']

          def mutate(reorder_labels):
              vals = original_values.copy()
              vals[1], vals[3] = vals[3], vals[1]
              changed = output_pattern.sub(
                  lambda match: match.group(1) + '[' + ', '.join(vals) + ']',
                  module, count=1)
              if reorder_labels:
                  labels = original_labels.copy()
                  labels[1], labels[3] = labels[3], labels[1]
                  changed = origins_pattern.sub(
                      lambda match: 'def output_origins : List String := ' + json.dumps(labels),
                      changed, count=1)
              return lead + sep + changed + end + tail

          results = {}
          for name, reorder_labels in (('field_binding_swap', False), ('paired_positional_reorder', True)):
              target = temp / ('replay-' + name) / 'ZirenDet'
              shutil.copytree(original_dir, target)
              (target / 'Chips' / 'AddSub.lean').write_text(mutate(reorder_labels))
              output = io.StringIO()
              changes = checker.compare(pinned, checker.snapshot(target), out=output)
              report = output.getvalue()
              results[name] = {
                  'weakening_count': changes,
                  'diagnostic': [line for line in report.splitlines()
                                 if 'AddSub/AddSub_is_add' in line],
              }
          assert results['field_binding_swap']['weakening_count'] >= 2
          assert sum('source-constrained field changed' in line for line in
                     results['field_binding_swap']['diagnostic']) >= 2
          assert results['paired_positional_reorder']['weakening_count'] >= 1
          assert any('WEAKENING' in line and 'outputs reordered' in line for line in
                     results['paired_positional_reorder']['diagnostic'])
          results['interpretation'] = ('The repaired guard requires review for both '
              'changed source bindings and a positional output-list reorder with matching '
              'origin labels; external consumer impact has not been established.')
          (temp / 'native-addsub-replay.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
          PY

      - name: Preserve receipts even on an incomplete or failed gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziren-format2-base-source-bridge-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/base-format2.json
            ${{ runner.temp }}/base-source-bridge.json
            ${{ runner.temp }}/base-source.sha256
            ${{ runner.temp }}/base.log
            ${{ runner.temp }}/keccak-archive-compatibility.json
            ${{ runner.temp }}/native-addsub-replay.json
