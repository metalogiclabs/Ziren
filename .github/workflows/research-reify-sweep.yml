name: Fork-only nested reification evidence sweep

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-reify-evidence-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a197403d766288502db5edd5eda02466e94db4a4
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-17
      - name: Generate genuine AddSub lowerer reification variants
        run: |
          set -eu
          cargo run -p zkm-picus -- --chip AddSub --format lean --lean-out-dir generated-default
          cargo run -p zkm-picus -- --chip AddSub --format lean --lean-out-dir generated-r4 --reify-threshold 4
          cargo run -p zkm-picus -- --chip AddSub --format lean --lean-out-dir generated-r2 --reify-threshold 2
          for mutation in \
            insert:3d3908185772c829cca76189c152ea0d36e96e2a \
            rebind:b27a54b029d73bc00ab8bf351f890bcf4325a3fe \
            shard:ce21e5838c95d354f9b806ad0cf3ed340afa9770
          do
            kind="${mutation%%:*}"
            pinned="${mutation#*:}"
            git switch --detach "$pinned"
            test "$(git rev-parse HEAD)" = "$pinned"
            cargo run -p zkm-picus -- --chip AddSub --format lean --lean-out-dir "generated-${kind}-r2" --reify-threshold 2
            echo "AUTHENTIC_MUTATED_REIFICATION: $kind $pinned"
          done
      - name: Diagnose source signature survival without promoting unknowns
        run: |
          git switch --detach 78722a403e7f8a2147e222ab14053b5c48f05720
          python3 -m unittest discover -s crates/fv/picus/scripts -p 'test_source_fidelity_compare_v2.py' -v
          python3 - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          p = Path("crates/fv/picus/scripts/port_source_witness.py")
          spec = importlib.util.spec_from_file_location("sourcev2", p)
          w = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = w
          spec.loader.exec_module(w)
          src = {k:Path(f"generated-{k}/ZirenDet/Chips/AddSub.lean").read_text()
                 for k in ("default", "r4", "r2", "insert-r2", "rebind-r2")}
          for specialization in ("AddSub_is_add","AddSub_is_sub"):
              base = w.source_witnesses(src["default"],specialization)
              print(f"BASE: {specialization} {len(base)} witnessed outputs")
              assert len(base) == 19, f"baseline output set changed: {specialization}"
              for k in ("r4","r2"):
                  try:
                      seen = w.source_witnesses(src[k],specialization)
                      verdict = w.compare_sources(src["default"],src[k],specialization)
                      print(f"REIFY_DIAGNOSTIC: module={specialization} threshold={k} witnessed={len(seen)} verdict={verdict}")
                      assert len(seen) == 19 and verdict == ("UNCHANGED", []), (specialization, k, len(seen), verdict)
                      for port in ("state_send[1]","state_send[3]"):
                          print(f"  {port}: {seen.get(port)}")
                  except w.Unwitnessed as error:
                      print(f"REIFY_UNKNOWN: module={specialization} threshold={k} {error}")
              for k, expected in (
                  ("insert-r2", ("UNCHANGED", [])),
                  ("rebind-r2", ("REVIEW_REQUIRED", ["state_send[3]"])),
              ):
                  seen = w.source_witnesses(src[k], specialization)
                  verdict = w.compare_sources(src["default"], src[k], specialization)
                  print(f"COMPOSED_DIAGNOSTIC: module={specialization} mutation={k} witnessed={len(seen)} verdict={verdict}")
                  assert len(seen) == 19 and verdict == expected, (specialization, k, len(seen), verdict)
          # Strong negative: preserve a true textual equality in an unrelated
          # Lean definition, while deleting it from active constraints_4.
          # The old module-wide grep would falsely classify this as unchanged.
          honest = src["r2"]
          equality = "  (w.v477 - (w.v443 * w.v444)) = 0 ∧\n"
          end_marker = "\nend AddSub_is_add"
          assert honest.count(equality) == 1 and honest.count(end_marker) == 1
          disconnected = honest.replace(equality, "", 1)
          disconnected = disconnected.replace(
              end_marker,
              "\ndef disconnected (w : W) : Prop :=\n"
              "  (w.v477 - (w.v443 * w.v444)) = 0\n" + end_marker,
              1,
          )
          lost = w.compare_sources(honest, disconnected, "AddSub_is_add")
          print(f"DISCONNECTED_BINDER_DIAGNOSTIC: {lost}")
          assert lost == ("UNKNOWN", ["state_send[3]"]), lost
          Path("generated-disconnected-lean").write_text(disconnected)
          print("BOUNDARY: source-level active-constraint witness only; not Lean proof, rel/theorem check, or production pinning")
          PY
          python3 crates/fv/picus/scripts/probe_claim_chain.py generated-r2/ZirenDet/Chips/AddSub.lean | tee claim-chain-v5.json
          test "$(sha256sum generated-r2/ZirenDet/Chips/AddSub.lean | cut -d' ' -f1)" = "c2137288a14ba63c5d610205c2470992dbeb3da325ae46fc1721b07a9c3c795b"
          ZIREN_ADD_SUB_LEAN=generated-r2/ZirenDet/Chips/AddSub.lean python3 -m unittest discover -s crates/fv/picus/scripts -p 'test_addsub_witness_probe.py' -v
          python3 crates/fv/picus/scripts/addsub_witness_probe.py generated-r2/ZirenDet/Chips/AddSub.lean | tee claim-chain-v6-domain-witness.json
          python3 - <<'PY' | tee rust-shard-u16-candidate.json
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "crates/fv/picus/scripts")
          import probe_claim_chain as v5
          import port_source_witness as v4
          import addsub_witness_probe as v6
          from pin_statements import compare_module
          base_path = Path("generated-r2/ZirenDet/Chips/AddSub.lean")
          changed_path = Path("generated-shard-r2/ZirenDet/Chips/AddSub.lean")
          base, changed = base_path.read_text(), changed_path.read_text()
          old, new = v5.module_view(base_path, "AddSub_is_add"), v5.module_view(changed_path, "AddSub_is_add")
          weak, info = compare_module(old["manifest"], new["manifest"])
          source_status, ports = v4.compare_sources(base, changed, "AddSub_is_add")
          result = {"case": "Rust RTypeFrameCols shard U16Range omission, fork-only",
                    "v1_weakening": weak, "v1_information": info,
                    "v4_status": source_status, "v4_ports": ports,
                    "source_original_sha": v6.hashlib.sha256(base.encode()).hexdigest(),
                    "source_mutant_sha": v6.hashlib.sha256(changed.encode()).hexdigest()}
          try:
              witness = v6.evaluate(changed, 65536)
              result["witness"] = {
                  "status": "QUALIFIED_SOURCE_ARITHMETIC",
                  "constraint_count": witness["constraint_count"],
                  "failed": witness["failed"],
                  "inputs": witness["inputs"],
                  "outputs": witness["outputs"],
              }
          except v6.Unqualified as error:
              result["witness"] = {"status": "UNKNOWN", "reason": str(error)}
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Preserve actual generated evidence at each threshold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zirensource-reify-threshold-sweep
          path: |
            generated-default/ZirenDet/Chips/AddSub.lean
            generated-r4/ZirenDet/Chips/AddSub.lean
            generated-r2/ZirenDet/Chips/AddSub.lean
            generated-insert-r2/ZirenDet/Chips/AddSub.lean
            generated-rebind-r2/ZirenDet/Chips/AddSub.lean
            generated-shard-r2/ZirenDet/Chips/AddSub.lean
            generated-disconnected-lean
            claim-chain-v5.json
            claim-chain-v6-domain-witness.json
            rust-shard-u16-candidate.json
          if-no-files-found: warn
